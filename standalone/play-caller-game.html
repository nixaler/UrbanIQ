  :root{
    --ink:#0f2018;
    --ink-2:#16281f;
    --ink-3:#1e352a;
    --leather:#8a4a1f;
    --leather-2:#6b3717;
    --leather-deep:#3a1d09;
    --turf:#1f5c37;
    --turf-alt:#1a4f2f;
    --chalk:#f3ede0;
    --chalk-dim:rgba(243,237,224,0.62);
    --chalk-faint:rgba(243,237,224,0.32);
    --telestrator:#ffcc33;
    --telestrator-ink:#231a02;
    --danger:#e2483d;
    --success:#3fd08f;
    --zone:#5aa7ff;
    --display:'Bebas Neue','Arial Narrow',sans-serif;
    --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    --shadow-lg:0 20px 50px rgba(0,0,0,0.45);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 90% at 50% -10%, #1c3a2a 0%, var(--ink) 55%),
      var(--ink);
    color:var(--chalk);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
  }

  button, input{ font-family:inherit; }
  button{ -webkit-tap-highlight-color:transparent; }

  #page{
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 14px 60px;
  }

  #stage{
    position:relative;
    width:100%;
    max-width:432px;
    background:linear-gradient(180deg,#132a20,#0f2018 60%);
    border-radius:22px;
    border:1px solid rgba(243,237,224,0.08);
    box-shadow:var(--shadow-lg);
    overflow:hidden;
    min-height:640px;
  }
  #stage.shake{ animation:pcShake .4s ease; }
  @keyframes pcShake{ 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }

  #app{ position:relative; min-height:640px; }
  .screen{ animation:pcFade .32s ease both; }
  @keyframes pcFade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 8px;
    gap:8px;
  }
  .brand{
    font-family:var(--display);
    font-size:16px;
    letter-spacing:2px;
    color:var(--chalk-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .btn{
    font-family:var(--body);
    font-weight:600;
    font-size:12.5px;
    letter-spacing:.3px;
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
    border:1px solid transparent;
    display:inline-flex; align-items:center; gap:6px;
    transition:transform .12s ease, filter .12s ease, opacity .12s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn:focus-visible{ outline:2px solid var(--telestrator); outline-offset:2px; }
  .btn.primary{ background:var(--telestrator); color:var(--telestrator-ink); font-weight:700; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.secondary{ background:rgba(243,237,224,0.08); color:var(--chalk); border-color:rgba(243,237,224,0.2); }
  .btn.secondary:hover{ background:rgba(243,237,224,0.13); }
  .btn.ghost{ background:transparent; color:var(--chalk-dim); border-color:rgba(243,237,224,0.22); }
  .btn.ghost:hover{ color:var(--chalk); border-color:rgba(243,237,224,0.4); }
  .btn.icon{ padding:9px 11px; }
  .btn.small{ padding:7px 10px; font-size:11px; }
  .btn.big{ width:100%; padding:16px 20px; font-size:15px; border-radius:11px; justify-content:center; }
  .btn[disabled]{ opacity:.38; cursor:default; pointer-events:none; }

  /* ---- Menu screen ---- */
  .menu-screen{ min-height:640px; display:flex; flex-direction:column; }
  .menu-hero{
    flex:1;
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:8px 28px 40px;
    overflow:hidden;
  }
  .menu-hero-ball{
    position:absolute;
    width:340px; height:510px;
    left:50%; top:46%;
    transform:translate(-50%,-50%) rotate(-8deg);
    background:linear-gradient(135deg,var(--leather),var(--leather-deep) 70%);
    clip-path:url(#pcFootballClip);
    opacity:.16;
    filter:blur(1px);
    pointer-events:none;
  }
  .menu-kicker{
    position:relative;
    font-size:11px; letter-spacing:4px; color:var(--telestrator);
    font-weight:600; margin-bottom:10px;
  }
  .menu-title{
    position:relative;
    font-family:var(--display);
    font-size:clamp(40px,11vw,60px);
    letter-spacing:2px;
    line-height:.95;
    margin:0 0 14px;
    text-wrap:balance;
    color:var(--chalk);
  }
  .menu-lede{
    position:relative;
    font-size:14px; line-height:1.65; color:var(--chalk-dim);
    max-width:300px; margin:0 0 30px;
    text-wrap:balance;
  }
  .menu-actions{ position:relative; display:flex; flex-direction:column; gap:11px; width:100%; max-width:300px; }
  .career-strip{
    position:relative;
    margin-top:30px;
    font-family:var(--display);
    font-size:12.5px; letter-spacing:1.6px; color:var(--chalk-dim);
    font-variant-numeric:tabular-nums;
  }

  /* ---- Formation screen ---- */
  .setup-row{
    display:flex; gap:8px; padding:0 18px 14px; flex-wrap:wrap; justify-content:center;
  }
  .setup-label{
    width:100%; text-align:center; font-size:10px; letter-spacing:2px; color:var(--chalk-faint); margin-bottom:2px;
  }
  .diff-chip{
    flex:1; min-width:96px;
    background:var(--ink-3);
    border:1px solid rgba(243,237,224,0.14);
    border-radius:10px;
    padding:9px 8px;
    text-align:center;
    cursor:pointer;
    color:var(--chalk-dim);
  }
  .diff-chip.active{ border-color:var(--telestrator); color:var(--chalk); background:#26402f; }
  .diff-chip .dc-name{ font-family:var(--display); font-size:14px; letter-spacing:1px; }
  .diff-chip .dc-sub{ font-size:9px; letter-spacing:.5px; margin-top:1px; }
  .practice-row{ padding:0 18px 6px; display:flex; justify-content:center; }
  .practice-toggle{
    display:flex; align-items:center; gap:8px;
    background:rgba(243,237,224,0.06);
    border:1px solid rgba(243,237,224,0.16);
    border-radius:20px; padding:7px 14px;
    font-size:11.5px; cursor:pointer; color:var(--chalk-dim);
  }
  .practice-toggle.on{ background:rgba(63,208,143,0.14); border-color:var(--success); color:var(--chalk); }

  .formation-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    padding:8px 18px 24px;
  }
  .formation-card{
    position:relative;
    background:var(--ink-3);
    border:1px solid rgba(243,237,224,0.1);
    border-radius:14px;
    padding:18px 14px;
    text-align:center;
    cursor:pointer;
    color:var(--chalk);
    transition:border-color .15s, transform .12s, background .15s;
  }
  .formation-card:hover{ border-color:var(--telestrator); background:#233d2f; }
  .formation-card:active{ transform:scale(0.98); }
  .formation-card:focus-visible{ outline:2px solid var(--telestrator); outline-offset:2px; }
  .formation-card.locked{ cursor:default; opacity:.55; }
  .formation-card.locked:hover{ border-color:rgba(243,237,224,0.1); background:var(--ink-3); }
  .fc-emoji{ font-size:28px; margin-bottom:8px; }
  .fc-name{ font-family:var(--display); font-size:18px; letter-spacing:1px; line-height:1.1; margin-bottom:5px; }
  .fc-desc{ font-size:11px; color:var(--chalk-dim); line-height:1.4; }
  .fc-lock{ position:absolute; top:10px; right:10px; font-size:14px; }
  .fc-unlock-req{ font-size:9.5px; color:var(--telestrator); margin-top:6px; letter-spacing:.3px; }

  /* ---- Playbook screen ---- */
  .playbook-list{ display:flex; flex-direction:column; gap:9px; padding:8px 18px 24px; }
  .empty-state{ text-align:center; color:var(--chalk-dim); font-size:13px; line-height:1.7; padding:70px 20px; }
  .playbook-row{
    display:flex; align-items:center; gap:11px;
    background:var(--ink-3);
    border:1px solid rgba(243,237,224,0.1);
    border-radius:12px;
    padding:11px 13px;
  }
  .pb-emoji{ font-size:22px; flex-shrink:0; }
  .pb-info{ flex:1; min-width:0; }
  .pb-name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pb-sub{ font-size:10px; color:var(--chalk-dim); margin-top:2px; }

  /* ---- Draw screen ---- */
  .hud-row{
    display:flex; justify-content:center; align-items:center; gap:12px;
    padding:0 16px 6px;
    font-size:10.5px; letter-spacing:1px; color:var(--chalk-dim);

  function generateDefense(formation, losY){
    var elig = eligibleAbs(formation, losY);
    var coverageType = rand() < 0.55 ? 'man' : 'zone';
    var defenders;
    if(coverageType==='man'){
      defenders = elig.map(function(p){
        return { id:'def-'+p.id, markId:p.id, zone:null, start:{
          x: clamp(p.start.x + (rand()-0.5)*10, 2, 98),
          y: clamp(p.start.y - 8 - rand()*6, 2, 98)
        } };
      });
      defenders.push({ id:'def-safety', markId:null, zone:null, start:{
        x: clamp(50 + (rand()-0.5)*24, 8, 92),
        y: clamp(losY - 34, 2, losY - 10)
      } });
    } else {
      var xs = [16, 38, 62, 84];
      defenders = xs.map(function(x,i){
        var zy = clamp(losY - 15 - (i%2===0?0:3), 6, losY-6);
        return { id:'def-zone'+i, markId:null, zone:{x:x,y:zy}, start:{x:x,y:zy} };
      });
      defenders.push({ id:'def-safety', markId:null, zone:{x:50, y:clamp(losY-34,2,losY-10)}, start:{x:50, y:clamp(losY-34,2,losY-10)} });
    }
    return { type: coverageType, defenders: defenders };
  }

  var toastTimer = null;
  function showToast(msg){
    S.toast = msg;

  function shakeStage(){

  function spawnConfetti(){
    var app = document.getElementById('app');
    if(!app) return;
    var layer = document.createElement('div');
    layer.className='confetti-layer';
    var colors = ['#ffcc33','#f3ede0','#3fd08f','#ff9b8f','#5aa7ff'];
    for(var i=0;i<36;i++){
      var p = document.createElement('div');
      p.className='confetti-piece';
      var w = 5+Math.random()*5, h=8+Math.random()*8;
      p.style.width=w+'px'; p.style.height=h+'px';
      p.style.left=(Math.random()*100)+'%';
      p.style.background=colors[i%colors.length];
      p.style.animationDelay=(Math.random()*0.3)+'s';
      p.style.animationDuration=(1.1+Math.random()*0.6)+'s';
      layer.appendChild(p);
    }
    var flash=document.createElement('div');
    flash.className='td-flash';
    app.appendChild(flash);
    app.appendChild(layer);
    setTimeout(function(){ layer.remove(); flash.remove(); }, 1800);
  }

    }
    for(i=0;i<19;i++){
      var hy = i*5+3;
      hash += '<line x1="41" y1="' + hy + '" x2="44" y2="' + hy + '" stroke="rgba(243,237,224,0.4)" stroke-width="0.35"/>' +
              '<line x1="56" y1="' + hy + '" x2="59" y2="' + hy + '" stroke="rgba(243,237,224,0.4)" stroke-width="0.35"/>';
    }
    for(i=0;i<9;i++){
      var y=(i+1)*10;
      yardLines += '<line x1="0" y1="' + y + '" x2="100" y2="' + y + '" stroke="rgba(243,237,224,0.55)" stroke-width="0.35"/>' +
        '<text x="6" y="' + (y-1.5) + '" font-size="3.4" fill="rgba(243,237,224,0.55)" class="yard-num">' + YARD_LABELS[i] + '</text>' +

    }
    var elig = eligibleAbs(formation, losY);
    elig.forEach(function(p){

    });

  function tokenStartPos(id, start){
    if(S.simPhase==='result'){
      var wp = S.routes[id];
      return (wp && wp.length) ? wp[wp.length-1] : start;

  function renderCoverageOverlay(formation, losY){
    if(S.practiceMode) return '';

      S.coverage.defenders.forEach(function(d){

      });
    } else {
      var elig = eligibleAbs(formation, losY);
      S.coverage.defenders.forEach(function(d){
        if(!d.markId) return;
        var p = elig.filter(function(e){ return e.id===d.markId; })[0];
        if(!p) return;
        var x1=d.start.x, y1=d.start.y, x2=p.start.x, y2=p.start.y;
        html += '<svg class="man-link" style="left:0;top:0;width:100%;height:100%;" viewBox="0 0 100 100" preserveAspectRatio="none">' +
          '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="rgba(226,72,61,0.35)" stroke-width="0.5" stroke-dasharray="1.5,1.5"/>' +
        '</svg>';
      });

  function renderFieldEntities(formation, losY){
    var qbPos = qbPosFor(formation, losY);
    var defHtml = S.defenders.map(function(d){
      var pos = S.simPhase==='result' ? defenderPosAtT(d, 1, formation, losY) : d.start;
      return '<div class="defender" id="pcDef-' + d.id + '" style="left:' + pos.x + '%; top:' + pos.y + '%;">✕</div>';
    }).join('');
    var qbHtml = '<div class="qb-token" id="pcQB" style="left:' + qbPos.x + '%; top:' + qbPos.y + '%;">QB</div>';
    var ballPos = qbPos, ballVisible = false;
    var elig = eligibleAbs(formation, losY);
    if(S.simPhase==='result' && S.targetId){
      var tWp = S.routes[S.targetId];
      var tPlayer = elig.filter(function(p){ return p.id===S.targetId; })[0];
      ballPos = tWp && tWp.length ? tWp[tWp.length-1] : (tPlayer ? tPlayer.start : qbPos);
      ballVisible = true;
    }
    var ballHtml = '<div class="ball-token" id="pcBall" style="left:' + ballPos.x + '%; top:' + ballPos.y + '%; display:' + (ballVisible?'block':'none') + ';">🏈</div>';
    var tokensHtml = elig.map(function(p){
      var hasRoute = !!S.routes[p.id];
      var isTarget = S.targetId===p.id;
      var isSelected = S.selectedPlayerId===p.id;
      var cls = ['player-token'];
      if(isTarget) cls.push('is-target'); else if(hasRoute) cls.push('has-route');
      if(isSelected) cls.push('is-selected');
      var pos = tokenStartPos(p.id, p.start);
      return '<div class="' + cls.join(' ') + '" id="pcToken-' + p.id + '" data-pid="' + p.id + '" style="left:' + pos.x + '%; top:' + pos.y + '%;">' + p.label + '</div>';
    }).join('');
    return renderCoverageOverlay(formation, losY) + defHtml + qbHtml + ballHtml + tokensHtml;
  }

    var isLast = S.tutorial.step === TUT_STEPS.length-1;
    return '<div class="tut-backdrop">' +
      '<div class="tut-card">' +
        '<div class="tut-emoji">' + step.emoji + '</div>' +
        '<div class="tut-title">' + escapeHtml(step.title) + '</div>' +
        '<div class="tut-body">' + escapeHtml(step.body) + '</div>' +
        '<div class="tut-dots">' + dots + '</div>' +
        '<div class="tut-actions">' +
          (isLast ? '' : '<button class="btn ghost small" onclick="App.skipTutorial()">Skip</button>') +
          '<button class="btn primary small" onclick="App.' + (isLast?'closeTutorial':'nextTutStep') + '()">' + (isLast?'Let\'s go':'Next') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderDraw(){
    var formation = getFormation(S.formationKey);
    var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
    var routedCount = Object.keys(S.routes).length;
    var coverageBadge = S.practiceMode ? '' : ('<span class="coverage-pill ' + S.coverage.type + '">' + (S.coverage.type==='man' ? '👤 MAN' : '🕸️ ZONE') + '</span>');
    var driveBadge = S.practiceMode ? '<span class="coverage-pill zone">🎯 PRACTICE</span>' : ('<span class="drive-pill">' + ordinal(S.drive.down) + ' &amp; ' + (S.drive.distance>=100-S.drive.fieldPos?'GOAL':S.drive.distance) + '</span>');
    return '' +
    '<div class="screen draw-screen">' +
      '<nav class="topbar">' +
        '<button class="btn ghost" onclick="App.goFormation()">← Formation</button>' +
        '<div class="brand">' + formation.emoji + ' ' + escapeHtml(formation.name) + '</div>' +
        '<button class="btn ghost icon" onclick="App.goPlaybook()">📖</button>' +
      '</nav>' +
      '<button class="mute-btn" onclick="App.toggleMute()">' + (S.muted?'🔇':'🔊') + '</button>' +
      '<div class="hud-row">' +
        '<span>ATT <b>' + S.session.attempts + '</b></span>' +
        '<span>COMP <b>' + S.session.completions + '</b></span>' +
        '<span>YDS <b>' + S.session.yards + '</b></span>' +
        '<span>TD <b>' + S.session.touchdowns + '</b></span>' +
      '</div>' +
      '<div class="drive-strip">' + driveBadge + coverageBadge + '</div>' +
      '<div class="field-wrap"><div class="field-outer">' +
        '<div class="field-leather"></div>' +
        '<div class="field-turf' + (S.selectedPlayerId?' armed':'') + '" id="pcField">' +
          renderFieldSvg(formation, losY) +
          renderFieldEntities(formation, losY) +
        '</div>' +
        renderLacesSvg() +
      '</div></div>' +
      (S.selectedPlayerId && S.simPhase==='idle' ? renderRouteChips() : '') +
      (S.simPhase==='idle' ? renderControls() : '') +
      (routedCount>0 && S.simPhase==='idle' && !S.selectedPlayerId ? renderTargetChips(formation, losY) : '') +
    '</div>' +
    renderResultModal();
  }

  // ---------------------------------------------------------------------
  // Drag-to-draw
  // ---------------------------------------------------------------------
  var dragPlayerId=null, dragRoute=null, dragMoved=false, dragWasSelected=false;

  function getRelPoint(e, el){
    var rect = el.getBoundingClientRect();
    return {
      x: clamp(((e.clientX-rect.left)/rect.width)*100, 0, 100),
      y: clamp(((e.clientY-rect.top)/rect.height)*100, 0, 100)
    };
  }

  function currentEligible(){
    var formation = getFormation(S.formationKey);
    var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
    return eligibleAbs(formation, losY);
  }

  function beginDrag(e, pid, wasSelected, fieldEl){
    if(S.simPhase!=='idle') return;
    var elig = currentEligible();
    var p = elig.filter(function(x){ return x.id===pid; })[0];
    if(!p) return;
    dragPlayerId = pid; dragMoved = false; dragWasSelected = wasSelected;
    try{ fieldEl.setPointerCapture(e.pointerId); }catch(err){}
    var pt = getRelPoint(e, fieldEl);
    dragRoute = [p.start, pt];
  }

  function onDragEnd(){
    var pid = dragPlayerId;
    if(!pid) return;
    if(dragMoved && dragRoute && dragRoute.length>=2){
      S.routes[pid] = dragRoute;
      if(!S.targetId) S.targetId = pid;
      S.selectedPlayerId = null;
      vibrate(10);
    } else if(dragWasSelected){
      S.selectedPlayerId = null;
    }
    dragPlayerId=null; dragRoute=null; dragMoved=false;
    render();
  }

  function attachDrawHandlers(){
    var field = document.getElementById('pcField');
    if(!field) return;
    var tokens = field.querySelectorAll('.player-token');
    for(var i=0;i<tokens.length;i++){
      (function(tokenEl){
        tokenEl.addEventListener('pointerdown', function(e){
          if(S.simPhase!=='idle') return;
          e.stopPropagation();
          var pid = tokenEl.getAttribute('data-pid');
          var wasSelected = S.selectedPlayerId===pid;
          S.selectedPlayerId = pid;
          beginDrag(e, pid, wasSelected, field);
        });
      })(tokens[i]);
    }
    field.addEventListener('pointerdown', function(e){
      if(S.simPhase!=='idle' || !S.selectedPlayerId) return;
      beginDrag(e, S.selectedPlayerId, true, field);
      e.preventDefault();
    });
    field.addEventListener('pointermove', function(e){
      if(!dragPlayerId || !dragRoute) return;
      var pt = getRelPoint(e, field);
      var last = dragRoute[dragRoute.length-1];
      if(dist(last, pt) > 2.2){
        dragMoved = true;
        dragRoute.push(pt);
        var pathEl = document.getElementById('pcRoute-' + dragPlayerId);
        if(pathEl) pathEl.setAttribute('d', routeSvgPath(dragRoute));
      }
      e.preventDefault();
    });
    field.addEventListener('pointerup', onDragEnd);
    field.addEventListener('pointercancel', onDragEnd);
  }

  // ---------------------------------------------------------------------
  // Defender pursuit + simulation
  // ---------------------------------------------------------------------
  function defenderPosAtT(def, t, formation, losY){
    var diff = getDifficulty(S.difficulty);
    if(def.zone){
      if(t<0.2) return def.start;
      var elig = eligibleAbs(formation, losY);
      var nearest=null, nearestD=Infinity;
      elig.forEach(function(p){
        var wp=S.routes[p.id]; if(!wp) return;
        var pos=pointAtT(wp,t);
        var d=dist(pos, def.zone);
        if(d<nearestD){ nearestD=d; nearest=pos; }
      });
      if(nearest && nearestD<22){
        return lerp(def.start, nearest, Math.min(1,(t-0.2)*1.1*diff.pursuit));
      }
      return def.start;
    }
    if(!def.markId){
      if(t<0.25 || !S.targetId) return def.start;
      var targetRoute = S.routes[S.targetId];
      if(!targetRoute) return def.start;
      var chaseT = Math.min(1, (t-0.25)/0.6*diff.pursuit);
      var chasePt = pointAtT(targetRoute, Math.min(1, (t-0.25)/0.75));
      return lerp(def.start, chasePt, chaseT);
    }
    var elig2 = eligibleAbs(formation, losY);
    var markedRoute = S.routes[def.markId];
    var anchorPlayer = elig2.filter(function(e){ return e.id===def.markId; })[0];
    var anchor = markedRoute ? pointAtT(markedRoute, t) : (anchorPlayer ? anchorPlayer.start : def.start);
    return lerp(def.start, anchor, Math.min(1, t*1.15*diff.pursuit));
  }

  function updateStats(outcome, yards){
    if(S.practiceMode) return;
    S.session.attempts++;
    if(outcome==='complete' || outcome==='touchdown') S.session.completions++;
    if(outcome==='touchdown') S.session.touchdowns++;
    S.session.yards += yards;
    S.career.attempts++;
    if(outcome==='complete' || outcome==='touchdown') S.career.completions++;
    if(outcome==='touchdown') S.career.touchdowns++;
    S.career.bestYards = Math.max(S.career.bestYards, yards);
    saveCareerLS(S.career);
  }

  function describeOutcome(outcome, nearestDefDist, coverageType, routeDepth){
    if(outcome==='touchdown'){
      var tdLines = ['Nothing but green in front of him!', 'Toe-tap, six points!', 'Wide open the whole way.'];
      return tdLines[Math.floor(rand()*tdLines.length)];
    }
    if(outcome==='complete'){
      if(nearestDefDist>10) return 'Wide open — easy pitch and catch.';
      return 'Squeezed it into a tight window.';
    }
    if(outcome==='intercepted'){
      return coverageType==='zone' ? 'Sat in the zone and read it the whole way.' : 'Jumped the route in man coverage.';
    }
    if(outcome==='turnover-on-downs'){
      return 'Caught it, but couldn\'t get there in time — turnover on downs.';
    }
    // incomplete
    if(coverageType==='zone' && nearestDefDist<7) return 'Zone closed the passing window.';
    if(coverageType==='man' && nearestDefDist<7) return 'Blanketed in man coverage.';
    if(routeDepth>32) return 'Overthrown — just missed the mark deep.';
    return 'Dropped — inches from a completion.';
  }

  function finishPlay(formation, losY){
    var diff = getDifficulty(S.difficulty);
    var elig = eligibleAbs(formation, losY);
    var targetPlayer = elig.filter(function(e){ return e.id===S.targetId; })[0];
    var targetRoute = S.routes[S.targetId];
    var finalPos = targetRoute ? targetRoute[targetRoute.length-1] : targetPlayer.start;
    var nearestDefDist;
    if(S.practiceMode){
      nearestDefDist = 40;
    } else {
      var defPositions = S.defenders.map(function(d){ return defenderPosAtT(d, 1, formation, losY); });
      nearestDefDist = defPositions.length ? Math.min.apply(null, defPositions.map(function(p){ return dist(p, finalPos); })) : 20;
    }
    var routeDepth = targetPlayer.start.y - finalPos.y;
    var depthDifficulty = clamp(routeDepth/60, 0, 0.5) * diff.depthMult;
    var chance = clamp(nearestDefDist/diff.sepDiv - depthDifficulty, 0.06, 0.94);
    var roll = Math.random();
    var outcome, yards=0, firstDown=false;

    if(roll < chance){
      yards = Math.max(1, Math.round(routeDepth * (0.55 + routeDepth/220)));
      var reachesGoal = S.practiceMode ? finalPos.y<=6 : (S.drive.fieldPos + yards) >= 100 || finalPos.y<=6;
      if(reachesGoal){
        outcome='touchdown';
        yards = S.practiceMode ? Math.max(yards, Math.round(losY*0.6)) : Math.max(1, 100 - S.drive.fieldPos);
      } else {
        outcome='complete';
      }
    } else if(!S.practiceMode && nearestDefDist < 5 && Math.random() < 0.15){
      outcome='intercepted';
    } else {
      outcome='incomplete';
    }

    // Drive bookkeeping
    if(!S.practiceMode){
      S.drive.plays++;
      if(outcome==='touchdown'){
        S.drive.driveYards += yards;
        S.drive.active = false;
      } else if(outcome==='intercepted'){
        S.drive.active = false;
      } else if(outcome==='complete'){
        S.drive.driveYards += yards;
        S.drive.fieldPos = clamp(S.drive.fieldPos + yards, 0, 99);
        if(S.drive.fieldPos >= S.drive.firstDownAt){
          firstDown = true;
          S.drive.down = 1;
          S.drive.distance = 10;
          S.drive.firstDownAt = Math.min(100, S.drive.fieldPos + 10);
        } else {
          S.drive.down += 1;
          S.drive.distance = S.drive.firstDownAt - S.drive.fieldPos;
          if(S.drive.down > 4){
            outcome = 'turnover-on-downs';
            S.drive.active = false;
          }
        }
      }
      // incomplete: down/distance/fieldPos unchanged
    }

    var reason = describeOutcome(outcome, nearestDefDist, S.coverage.type, routeDepth);
    S.result = { outcome:outcome, yards:yards, reason:reason, firstDown:firstDown };
    S.simPhase = 'result';
    updateStats(outcome, yards);

    if(outcome==='touchdown'){ vibrate([30,40,30]); sfxTouchdown(); spawnConfetti(); }
    else if(outcome==='intercepted'){ vibrate([50,30,50,30,50]); sfxInterception(); shakeStage(); }
    else if(outcome==='turnover-on-downs'){ vibrate([60,40,60]); sfxIncomplete(); shakeStage(); }
    else if(outcome==='complete'){ vibrate(firstDown?[15,15]:15); if(firstDown) sfxFirstDown(); else sfxCatch(); }
    else { vibrate(25); sfxIncomplete(); }

    render();
  }

  function runPlayAnim(){
    if(!S.targetId || S.simPhase!=='idle') return;
    S.selectedPlayerId = null;
    S.simPhase = 'running';
    render();
    sfxWhistle();

    var formation = getFormation(S.formationKey);
    var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
    var elig = eligibleAbs(formation, losY);
    var tokenEls = {};
    elig.forEach(function(p){ tokenEls[p.id] = document.getElementById('pcToken-' + p.id); });
    var defEls = S.defenders.map(function(d){ return { def:d, el:document.getElementById('pcDef-' + d.id) }; });
    var ballEl = document.getElementById('pcBall');
    var qbPos = qbPosFor(formation, losY);
    var startTime = performance.now();
    var DURATION = 1500;

    function frame(now){
      var t = clamp((now-startTime)/DURATION, 0, 1);
      var routeT = Math.min(1, t/0.75);
      var ballT = clamp((t-0.75)/0.25, 0, 1);

      elig.forEach(function(p){
        var wp = S.routes[p.id];
        var pos = wp ? pointAtT(wp, routeT) : p.start;
        var el = tokenEls[p.id];
        if(el){ el.style.left = pos.x + '%'; el.style.top = pos.y + '%'; }
      });
      defEls.forEach(function(pair){
        var pos = defenderPosAtT(pair.def, routeT, formation, losY);
        if(pair.el){ pair.el.style.left = pos.x + '%'; pair.el.style.top = pos.y + '%'; }
      });
      if(ballT>0){
        var targetWp = S.routes[S.targetId];
        var targetPlayer = elig.filter(function(e){ return e.id===S.targetId; })[0];
        var targetPos = targetWp ? pointAtT(targetWp, routeT) : targetPlayer.start;
        var bp = lerp(qbPos, targetPos, ballT);
        var arc = Math.sin(Math.PI*ballT)*10;
        if(ballEl){ ballEl.style.display='block'; ballEl.style.left = bp.x + '%'; ballEl.style.top = (bp.y-arc) + '%'; }
      }
      if(t<1){ requestAnimationFrame(frame); }
      else { finishPlay(formation, losY); }
    }
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------
  // Actions
  // ---------------------------------------------------------------------
  window.App = {
    goMenu:function(){ S.screen='menu'; render(); },
    goFormation:function(){ S.screen='formation'; render(); },
    goPlaybook:function(){ S.screen='playbook'; render(); },
    setDifficulty:function(key){
      S.difficulty = key;
      savePrefsLS({ difficulty:S.difficulty, muted:S.muted });
      sfxSelect();
      render();
    },
    togglePractice:function(){
      S.practiceMode = !S.practiceMode;
      sfxSelect();
      render();
    },
    toggleMute:function(){
      S.muted = !S.muted;
      savePrefsLS({ difficulty:S.difficulty, muted:S.muted });
      render();
    },
    pickFormation:function(key){
      var f = getFormation(key);
      if(!isUnlocked(f, S.career)) return;
      if(!S.practiceMode && !S.drive.active) newDrive();
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      S.formationKey=key; S.routes={}; S.targetId=null; S.selectedPlayerId=null;
      var cov = generateDefense(f, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      S.simPhase='idle'; S.result=null;
      S.screen='draw';
      vibrate(8);
      render();
      if(!localStorage.getItem(TUT_KEY)){
        S.tutorial = { active:true, step:0 };
        render();
      }
    },
    applyTemplate:function(templateKey){
      if(!S.selectedPlayerId) return;
      var elig = currentEligible();
      var p = elig.filter(function(e){ return e.id===S.selectedPlayerId; })[0];
      var tpl = ROUTE_TEMPLATES.filter(function(t){ return t.key===templateKey; })[0];
      if(!p || !tpl) return;
      var formation = getFormation(S.formationKey);
      S.routes[p.id] = tpl.build(p.start, p.start.y + 20);
      if(!S.targetId) S.targetId = p.id;
      S.selectedPlayerId = null;
      vibrate(10);
      render();
    },
    clearRoute:function(id){ delete S.routes[id]; if(S.targetId===id) S.targetId=null; render(); },
    clearAllRoutes:function(){ S.routes={}; S.targetId=null; S.selectedPlayerId=null; render(); },
    setTarget:function(id){ S.targetId=id; render(); },
    shuffleDefense:function(){
      if(S.simPhase!=='idle') return;
      var formation = getFormation(S.formationKey);
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      var cov = generateDefense(formation, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      vibrate(6);
      render();
    },
    runPlay:function(){ runPlayAnim(); },
    runAgain:function(){
      S.simPhase='idle'; S.result=null;
      var formation = getFormation(S.formationKey);
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      var cov = generateDefense(formation, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      render();
    },
    newPlay:function(){
      S.routes={}; S.targetId=null; S.selectedPlayerId=null;
      S.simPhase='idle'; S.result=null;
      var formation = getFormation(S.formationKey);
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      var cov = generateDefense(formation, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      render();
    },
    nextPlay:function(){
      S.showSaveInput=false;
      S.screen='formation';
      S.routes={}; S.targetId=null; S.selectedPlayerId=null;
      S.simPhase='idle'; S.result=null;
      render();
    },
    startNewDrive:function(){
      newDrive();
      S.showSaveInput=false;
      S.screen='formation';
      S.routes={}; S.targetId=null; S.selectedPlayerId=null;
      S.simPhase='idle'; S.result=null;
      render();
    },
    openSave:function(){
      S.showSaveInput=true; S.saveNameText='';
      render();
      setTimeout(function(){ var el=document.getElementById('pcSaveName'); if(el) el.focus(); }, 0);
    },
    cancelSave:function(){ S.showSaveInput=false; render(); },
    setSaveName:function(v){ S.saveNameText=v; },
    confirmSave:function(){
      var formation = getFormation(S.formationKey);
      var name = (S.saveNameText||'').trim() || (formation.name + ' Special');
      var play = { id:uid(), name:name, formationKey:S.formationKey, routes:S.routes, targetId:S.targetId, createdAt:Date.now() };
      S.playbook = [play].concat(S.playbook).slice(0,30);
      savePlaybookLS(S.playbook);
      S.showSaveInput=false;
      showToast('Saved "' + name + '" to your playbook!');
    },
    loadPlay:function(id){
      var play = S.playbook.filter(function(p){ return p.id===id; })[0];
      if(!play) return;
      if(!S.practiceMode && !S.drive.active) newDrive();
      var f = getFormation(play.formationKey);
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      S.formationKey = play.formationKey;
      S.routes = JSON.parse(JSON.stringify(play.routes));
      S.targetId = play.targetId;
      var cov = generateDefense(f, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      S.simPhase='idle'; S.result=null;
      S.screen='draw';
      render();
    },
    deletePlay:function(id){
      S.playbook = S.playbook.filter(function(p){ return p.id!==id; });
      savePlaybookLS(S.playbook);
      render();
    },
    nextTutStep:function(){ S.tutorial.step = Math.min(TUT_STEPS.length-1, S.tutorial.step+1); render(); },
    skipTutorial:function(){ S.tutorial.active=false; try{ localStorage.setItem(TUT_KEY,'1'); }catch(e){} render(); },
    closeTutorial:function(){ S.tutorial.active=false; try{ localStorage.setItem(TUT_KEY,'1'); }catch(e){} render(); }
  };

  render();
})();
</script>
