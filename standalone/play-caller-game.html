  :root{
    --void:#05060c;
    --void-2:#0b0e1a;
    --void-3:rgba(255,255,255,0.045);
    --panel-line:rgba(255,255,255,0.14);
    --leather:#57e7ff;
    --leather-2:#ff6fd8;
    --leather-deep:#241a4a;
    --turf:#071c18;
    --turf-alt:#051512;
    --chalk:#eef3ff;
    --chalk-dim:rgba(238,243,255,0.64);
    --chalk-faint:rgba(238,243,255,0.34);
    --telestrator:#57e7ff;
    --telestrator-ink:#03181c;
    --danger:#ff5470;
    --success:#3dffc2;
    --zone:#8c7bff;
    --flame1:#ffcf6b;
    --flame2:#ff6fd8;
    --volt:#ffe27a;
    --holo:linear-gradient(100deg,#57e7ff,#8c7bff 35%,#ff6fd8 68%,#ffcf6b 100%);
    --display:'Orbitron','Rajdhani',sans-serif;
    --body:'Rajdhani',system-ui,-apple-system,'Segoe UI',sans-serif;
    --shadow-lg:0 20px 50px rgba(0,0,0,0.55);
    --glass-bg:rgba(255,255,255,0.045);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,0.16);
    --glow-cyan:0 0 0 1px rgba(87,231,255,0.55), 0 0 22px rgba(87,231,255,0.32);
    --glow-flame:0 0 0 1px rgba(255,207,107,0.55), 0 0 22px rgba(255,111,216,0.35);
    --r-lg:22px;
    --r-md:14px;
    --r-sm:10px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(70% 45% at 12% -6%, rgba(87,231,255,0.14) 0%, rgba(87,231,255,0) 60%),
      radial-gradient(70% 45% at 100% 6%, rgba(255,111,216,0.12) 0%, rgba(255,111,216,0) 60%),
      radial-gradient(90% 60% at 50% 112%, rgba(140,123,255,0.16) 0%, rgba(140,123,255,0) 60%),
      var(--void);
    background-attachment:fixed;
    color:var(--chalk);
    font-family:var(--body);
    font-weight:500;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  button, input{ font-family:inherit; }
  button{ -webkit-tap-highlight-color:transparent; }

  #page{ position:relative; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:28px 14px 60px; }
  .ambient-orb{ position:fixed; border-radius:50%; filter:blur(70px); opacity:.32; pointer-events:none; z-index:0; }
  .orb-a{ width:360px; height:360px; left:-100px; top:6%; background:radial-gradient(circle, var(--leather), transparent 70%); animation:pcDrift 24s ease-in-out infinite; }
  .orb-b{ width:320px; height:320px; right:-110px; top:52%; background:radial-gradient(circle, var(--leather-2), transparent 70%); animation:pcDrift 30s ease-in-out infinite -8s; }
  .orb-c{ width:280px; height:280px; left:18%; bottom:-110px; background:radial-gradient(circle, var(--zone), transparent 70%); animation:pcDrift 34s ease-in-out infinite -16s; }
  @keyframes pcDrift{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(26px,-34px) scale(1.12); } }

  #stage{
    position:relative; z-index:1;
    width:100%;
    max-width:432px;
    background:linear-gradient(165deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015)), var(--void-2);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
    border-radius:var(--r-lg);
    border:1px solid var(--panel-line);
    box-shadow:var(--shadow-lg), var(--glass-hi), 0 0 46px rgba(140,123,255,0.14);
    overflow:hidden;
    min-height:640px;
  }
  #stage::before{
    content:'';
    position:absolute; inset:0 0 auto 0; pointer-events:none; z-index:1;
    background:var(--holo);
    background-size:220% auto;

  // ---------------------------------------------------------------------
  // Math helpers
  // ---------------------------------------------------------------------
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function lerp(a,b,t){ return { x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t }; }
  // Glyph is authored facing "up" (0deg). Returns a compass-style heading in degrees.
  function headingDeg(dx, dy){
    if(Math.abs(dx)<0.001 && Math.abs(dy)<0.001) return null;
    return Math.atan2(dx, -dy) * 180 / Math.PI;
  }
  function routeHeadingAtT(wp, t){
    var a = pointAtT(wp, t);
    var b = pointAtT(wp, Math.min(1, t+0.04));
    var h = headingDeg(b.x-a.x, b.y-a.y);
    if(h===null){ b = pointAtT(wp, Math.max(0, t-0.04)); h = headingDeg(a.x-b.x, a.y-b.y); }
    return h;
  }
  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
  function pointAtT(wps, t){
    if(!wps || wps.length===0) return {x:50,y:50};
    if(wps.length===1) return wps[0];
    var segLens=[], total=0, i;
    for(i=0;i<wps.length-1;i++){ var d=dist(wps[i],wps[i+1]); segLens.push(d); total+=d; }
    if(total===0) return wps[wps.length-1];
    var target = clamp(t,0,1)*total;
    for(i=0;i<segLens.length;i++){
      if(target<=segLens[i] || i===segLens.length-1){
        var segT = segLens[i]===0 ? 0 : Math.min(1, target/segLens[i]);
        return lerp(wps[i], wps[i+1], segT);
      }
      target -= segLens[i];
    }
    return wps[wps.length-1];
  }
  var seedCounter = 1;
  function rand(){ seedCounter = (seedCounter*9301+49297)%233280; return seedCounter/233280; }

  var audioCtx = null;
  function getAudioCtx(){
    if(S.muted) return null;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }
  function tone(freq, start, dur, type, gain, ctx){
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
    g.gain.setValueAtTime(0, ctx.currentTime+start);
    g.gain.linearRampToValueAtTime(gain||0.14, ctx.currentTime+start+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(ctx.currentTime+start);
    osc.stop(ctx.currentTime+start+dur+0.02);
  }
  function sfxWhistle(){ var ctx=getAudioCtx(); if(!ctx) return; try{
    var osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(1900, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(2400, ctx.currentTime+0.08);
    osc.frequency.linearRampToValueAtTime(1700, ctx.currentTime+0.22);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.11, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.26);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.3);
  }catch(e){} }

    g.gain.setValueAtTime(0.09, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.42);

  function renderFieldSvg(formation, losY){
    var i, turfStripes='', hash='', yardLines='', routePaths='';
    for(i=0;i<10;i++){
      turfStripes += '<rect x="0" y="' + (i*10) + '" width="100" height="10" fill="' + (i%2===0 ? 'var(--turf)' : 'var(--turf-alt)') + '"/>';
    }
    for(i=0;i<19;i++){
      var hy = i*5+3;
      hash += '<line x1="41" y1="' + hy + '" x2="44" y2="' + hy + '" stroke="rgba(200,190,255,0.35)" stroke-width="0.35"/>' +
              '<line x1="56" y1="' + hy + '" x2="59" y2="' + hy + '" stroke="rgba(200,190,255,0.35)" stroke-width="0.35"/>';
    }
    for(i=0;i<9;i++){
      var y=(i+1)*10;
      yardLines += '<line x1="0" y1="' + y + '" x2="100" y2="' + y + '" stroke="rgba(220,210,255,0.5)" stroke-width="0.35"/>' +
        '<text x="6" y="' + (y-1.5) + '" font-size="3.4" fill="rgba(220,210,255,0.5)" class="yard-num">' + YARD_LABELS[i] + '</text>' +
        '<text x="94" y="' + (y-1.5) + '" font-size="3.4" fill="rgba(220,210,255,0.5)" text-anchor="end" class="yard-num">' + YARD_LABELS[i] + '</text>';
    }
    var elig = eligibleAbs(formation, losY);
    elig.forEach(function(p){
      var wps = S.routes[p.id];
      var d = (wps && wps.length>=2) ? routeSvgPath(wps) : '';
      var isTarget = S.targetId===p.id;
      routePaths += '<path id="pcRoute-' + p.id + '" d="' + d + '" fill="none" stroke="' + (isTarget?'var(--telestrator)':'rgba(196,178,255,0.85)') + '" stroke-width="' + (isTarget?0.9:0.7) + '" stroke-dasharray="2.2,1.6" stroke-linecap="round" marker-end="url(#pcArrow)"/>';
    });
    var firstDownLine = '';
    if(S.drive.active && !S.practiceMode){
      var fdY = losYFor(S.drive.firstDownAt);
      firstDownLine = '<line x1="0" y1="' + fdY + '" x2="100" y2="' + fdY + '" stroke="var(--telestrator)" stroke-width="0.5" stroke-dasharray="1.5,1.5" stroke-opacity="0.65"/>';
    }
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" class="field-svg">' +
      '<defs><marker id="pcArrow" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--telestrator)"/></marker></defs>' +
      turfStripes +
      '<rect x="0" y="0" width="100" height="6" fill="rgba(10,4,25,0.6)"/>' +
      hash + yardLines +
      '<line x1="0" y1="6" x2="100" y2="6" stroke="rgba(226,220,255,0.75)" stroke-width="0.8"/>' +
      firstDownLine +
      '<line x1="0" y1="' + losY + '" x2="100" y2="' + losY + '" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.85"/>' +
      routePaths +
      '</svg>';
  }

  function tokenStartPos(id, start){
    if(S.simPhase==='result'){
      var wp = S.routes[id];
      return (wp && wp.length) ? wp[wp.length-1] : start;
    }
    return start;
  }

  function renderCoverageOverlay(formation, losY){
    if(S.practiceMode) return '';
    var html = '';
    if(S.coverage.type==='zone'){
      S.coverage.defenders.forEach(function(d){
        if(!d.zone) return;
        html += '<div class="zone-shade" style="left:' + d.zone.x + '%; top:' + d.zone.y + '%; width:120px; height:120px;"></div>';
      });
    } else {
      var elig = eligibleAbs(formation, losY);
      S.coverage.defenders.forEach(function(d){
        if(!d.markId) return;
        var p = elig.filter(function(e){ return e.id===d.markId; })[0];
        if(!p) return;
        var x1=d.start.x, y1=d.start.y, x2=p.start.x, y2=p.start.y;
        html += '<svg class="man-link" style="left:0;top:0;width:100%;height:100%;" viewBox="0 0 100 100" preserveAspectRatio="none">' +
          '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="rgba(255,59,110,0.4)" stroke-width="0.5" stroke-dasharray="1.5,1.5"/>' +
        '</svg>';
      });
    }
    return html;
  }

  function figureSvg(symbolId, extraStyle){
    return '<svg class="token-figure" viewBox="0 0 24 32" style="' + (extraStyle||'') + '"><use href="#' + symbolId + '"/></svg>';

  function renderFieldEntities(formation, losY){
    var qbPos = qbPosFor(formation, losY);
    var defHtml = S.defenders.map(function(d){
      var pos, heading = 180;
      if(S.simPhase==='result'){
        pos = defenderPosAtT(d, 1, formation, losY);
        var prevPos = defenderPosAtT(d, 0.94, formation, losY);
        var h = headingDeg(pos.x-prevPos.x, pos.y-prevPos.y);
        if(h!==null) heading = h;
      } else {
        pos = d.start;
      }
      return '<div class="defender" id="pcDef-' + d.id + '" style="left:' + pos.x + '%; top:' + pos.y + '%;">' +
        figureSvg('pcRunner', 'transform:rotate(' + heading + 'deg)') +
      '</div>';
    }).join('');
    var qbHtml = '<div class="qb-token" id="pcQB" style="left:' + qbPos.x + '%; top:' + qbPos.y + '%;">' +
      figureSvg('pcQBFig', '') + '<span class="token-label">QB</span>' +
    '</div>';
    var ballPos = qbPos, ballVisible = false;
    var elig = eligibleAbs(formation, losY);
    if(S.simPhase==='result' && S.targetId){
      var tWp = S.routes[S.targetId];
      var tPlayer = elig.filter(function(p){ return p.id===S.targetId; })[0];
      ballPos = tWp && tWp.length ? tWp[tWp.length-1] : (tPlayer ? tPlayer.start : qbPos);
      ballVisible = true;
    }
    var ballHtml = '<div class="ball-token" id="pcBall" style="left:' + ballPos.x + '%; top:' + ballPos.y + '%; display:' + (ballVisible?'block':'none') + ';">🏈</div>';
    var tokensHtml = elig.map(function(p){
      var hasRoute = !!S.routes[p.id];
      var isTarget = S.targetId===p.id;
      var isSelected = S.selectedPlayerId===p.id;
      var cls = ['player-token'];
      if(isTarget) cls.push('is-target'); else if(hasRoute) cls.push('has-route');
      if(isSelected) cls.push('is-selected');
      var pos = tokenStartPos(p.id, p.start);
      var heading = 0;
      if(S.simPhase==='result' && S.routes[p.id]){
        var rh = routeHeadingAtT(S.routes[p.id], 0.98);
        if(rh!==null) heading = rh;
      }
      return '<div class="' + cls.join(' ') + '" id="pcToken-' + p.id + '" data-pid="' + p.id + '" style="left:' + pos.x + '%; top:' + pos.y + '%;">' +
        figureSvg('pcRunner', 'transform:rotate(' + heading + 'deg)') +
        '<span class="token-label">' + p.label + '</span>' +
      '</div>';
    }).join('');
    return renderCoverageOverlay(formation, losY) + defHtml + qbHtml + ballHtml + tokensHtml;
  }

  // ---------------------------------------------------------------------
  // Drag-to-draw
  // ---------------------------------------------------------------------
  var dragPlayerId=null, dragRoute=null, dragMoved=false, dragWasSelected=false;

  function getRelPoint(e, el){
    var rect = el.getBoundingClientRect();
    return {
      x: clamp(((e.clientX-rect.left)/rect.width)*100, 0, 100),
      y: clamp(((e.clientY-rect.top)/rect.height)*100, 0, 100)
    };
  }

  function currentEligible(){
    var formation = getFormation(S.formationKey);
    var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
    return eligibleAbs(formation, losY);
  }

  function beginDrag(e, pid, wasSelected, fieldEl){
    if(S.simPhase!=='idle') return;
    var elig = currentEligible();
    var p = elig.filter(function(x){ return x.id===pid; })[0];
    if(!p) return;
    dragPlayerId = pid; dragMoved = false; dragWasSelected = wasSelected;
    try{ fieldEl.setPointerCapture(e.pointerId); }catch(err){}
    var pt = getRelPoint(e, fieldEl);
    dragRoute = [p.start, pt];
  }

  function onDragEnd(){
    var pid = dragPlayerId;
    if(!pid) return;
    if(dragMoved && dragRoute && dragRoute.length>=2){
      S.routes[pid] = dragRoute;
      if(!S.targetId) S.targetId = pid;
      S.selectedPlayerId = null;
      vibrate(10);
    } else if(dragWasSelected){
      S.selectedPlayerId = null;
    }
    dragPlayerId=null; dragRoute=null; dragMoved=false;
    render();
  }

  function attachDrawHandlers(){
    var field = document.getElementById('pcField');
    if(!field) return;
    var tokens = field.querySelectorAll('.player-token');
    for(var i=0;i<tokens.length;i++){
      (function(tokenEl){
        tokenEl.addEventListener('pointerdown', function(e){
          if(S.simPhase!=='idle') return;
          e.stopPropagation();
          var pid = tokenEl.getAttribute('data-pid');
          var wasSelected = S.selectedPlayerId===pid;
          S.selectedPlayerId = pid;
          beginDrag(e, pid, wasSelected, field);
        });
      })(tokens[i]);
    }
    field.addEventListener('pointerdown', function(e){
      if(S.simPhase!=='idle' || !S.selectedPlayerId) return;
      beginDrag(e, S.selectedPlayerId, true, field);
      e.preventDefault();
    });
    field.addEventListener('pointermove', function(e){
      if(!dragPlayerId || !dragRoute) return;
      var pt = getRelPoint(e, field);
      var last = dragRoute[dragRoute.length-1];
      if(dist(last, pt) > 2.2){
        dragMoved = true;
        dragRoute.push(pt);
        var pathEl = document.getElementById('pcRoute-' + dragPlayerId);
        if(pathEl) pathEl.setAttribute('d', routeSvgPath(dragRoute));
      }
      e.preventDefault();
    });
    field.addEventListener('pointerup', onDragEnd);
    field.addEventListener('pointercancel', onDragEnd);
  }

  // ---------------------------------------------------------------------
  // Defender pursuit + simulation
  // ---------------------------------------------------------------------
  function defenderPosAtT(def, t, formation, losY){
    var diff = getDifficulty(S.difficulty);
    if(def.zone){
      if(t<0.2) return def.start;
      var elig = eligibleAbs(formation, losY);
      var nearest=null, nearestD=Infinity;
      elig.forEach(function(p){
        var wp=S.routes[p.id]; if(!wp) return;
        var pos=pointAtT(wp,t);
        var d=dist(pos, def.zone);
        if(d<nearestD){ nearestD=d; nearest=pos; }
      });
      if(nearest && nearestD<22){
        return lerp(def.start, nearest, Math.min(1,(t-0.2)*1.1*diff.pursuit));
      }
      return def.start;
    }
    if(!def.markId){
      if(t<0.25 || !S.targetId) return def.start;
      var targetRoute = S.routes[S.targetId];
      if(!targetRoute) return def.start;
      var chaseT = Math.min(1, (t-0.25)/0.6*diff.pursuit);
      var chasePt = pointAtT(targetRoute, Math.min(1, (t-0.25)/0.75));
      return lerp(def.start, chasePt, chaseT);
    }
    var elig2 = eligibleAbs(formation, losY);
    var markedRoute = S.routes[def.markId];
    var anchorPlayer = elig2.filter(function(e){ return e.id===def.markId; })[0];
    var anchor = markedRoute ? pointAtT(markedRoute, t) : (anchorPlayer ? anchorPlayer.start : def.start);
    return lerp(def.start, anchor, Math.min(1, t*1.15*diff.pursuit));
  }

  function updateStats(outcome, yards){
    if(S.practiceMode) return;
    S.session.attempts++;
    if(outcome==='complete' || outcome==='touchdown'){
      S.session.completions++;
      S.session.streak++;
    } else {
      S.session.streak = 0;
    }
    if(outcome==='touchdown') S.session.touchdowns++;
    S.session.yards += yards;
    S.career.attempts++;
    if(outcome==='complete' || outcome==='touchdown') S.career.completions++;
    if(outcome==='touchdown') S.career.touchdowns++;
    S.career.bestYards = Math.max(S.career.bestYards, yards);
    saveCareerLS(S.career);
  }

  function describeOutcome(outcome, nearestDefDist, coverageType, routeDepth){
    if(outcome==='touchdown'){
      var tdLines = ['Nothing but green in front of him!', 'Toe-tap, six points!', 'Wide open the whole way.'];
      return tdLines[Math.floor(rand()*tdLines.length)];
    }
    if(outcome==='complete'){
      if(nearestDefDist>10) return 'Wide open — easy pitch and catch.';
      return 'Squeezed it into a tight window.';
    }
    if(outcome==='intercepted'){
      return coverageType==='zone' ? 'Sat in the zone and read it the whole way.' : 'Jumped the route in man coverage.';
    }
    if(outcome==='turnover-on-downs'){
      return 'Caught it, but couldn\'t get there in time — turnover on downs.';
    }
    // incomplete
    if(coverageType==='zone' && nearestDefDist<7) return 'Zone closed the passing window.';
    if(coverageType==='man' && nearestDefDist<7) return 'Blanketed in man coverage.';
    if(routeDepth>32) return 'Overthrown — just missed the mark deep.';
    return 'Dropped — inches from a completion.';
  }

  function finishPlay(formation, losY){
    var diff = getDifficulty(S.difficulty);
    var elig = eligibleAbs(formation, losY);
    var targetPlayer = elig.filter(function(e){ return e.id===S.targetId; })[0];
    var targetRoute = S.routes[S.targetId];
    var finalPos = targetRoute ? targetRoute[targetRoute.length-1] : targetPlayer.start;
    var nearestDefDist;
    if(S.practiceMode){
      nearestDefDist = 40;
    } else {
      var defPositions = S.defenders.map(function(d){ return defenderPosAtT(d, 1, formation, losY); });
      nearestDefDist = defPositions.length ? Math.min.apply(null, defPositions.map(function(p){ return dist(p, finalPos); })) : 20;
    }
    var routeDepth = targetPlayer.start.y - finalPos.y;
    var depthDifficulty = clamp(routeDepth/60, 0, 0.5) * diff.depthMult;
    var fireBonus = (!S.practiceMode && S.session.streak>=2) ? Math.min(0.12, S.session.streak*0.04) : 0;
    var chance = clamp(nearestDefDist/diff.sepDiv - depthDifficulty + fireBonus, 0.06, 0.96);
    var roll = Math.random();
    var outcome, yards=0, firstDown=false;

    if(roll < chance){
      yards = Math.max(1, Math.round(routeDepth * (0.55 + routeDepth/220)));
      var reachesGoal = S.practiceMode ? finalPos.y<=6 : (S.drive.fieldPos + yards) >= 100 || finalPos.y<=6;
      if(reachesGoal){
        outcome='touchdown';
        yards = S.practiceMode ? Math.max(yards, Math.round(losY*0.6)) : Math.max(1, 100 - S.drive.fieldPos);
      } else {
        outcome='complete';
      }
    } else if(!S.practiceMode && nearestDefDist < 5 && Math.random() < 0.15){
      outcome='intercepted';
    } else {
      outcome='incomplete';
    }

    // Drive bookkeeping
    if(!S.practiceMode){
      S.drive.plays++;
      if(outcome==='touchdown'){
        S.drive.driveYards += yards;
        S.drive.active = false;
      } else if(outcome==='intercepted'){
        S.drive.active = false;
      } else if(outcome==='complete'){
        S.drive.driveYards += yards;
        S.drive.fieldPos = clamp(S.drive.fieldPos + yards, 0, 99);
        if(S.drive.fieldPos >= S.drive.firstDownAt){
          firstDown = true;
          S.drive.down = 1;
          S.drive.distance = 10;
          S.drive.firstDownAt = Math.min(100, S.drive.fieldPos + 10);
        } else {
          S.drive.down += 1;
          S.drive.distance = S.drive.firstDownAt - S.drive.fieldPos;
          if(S.drive.down > 4){
            outcome = 'turnover-on-downs';
            S.drive.active = false;
          }
        }
      }
      // incomplete: down/distance/fieldPos unchanged
    }

    var reason = describeOutcome(outcome, nearestDefDist, S.coverage.type, routeDepth);
    S.result = { outcome:outcome, yards:yards, reason:reason, firstDown:firstDown };
    S.simPhase = 'result';
    updateStats(outcome, yards);

    if(outcome==='touchdown'){ vibrate([30,40,30]); sfxTouchdown(); spawnConfetti(); }
    else if(outcome==='intercepted'){ vibrate([50,30,50,30,50]); sfxInterception(); shakeStage(); }
    else if(outcome==='turnover-on-downs'){ vibrate([60,40,60]); sfxIncomplete(); shakeStage(); }
    else if(outcome==='complete'){ vibrate(firstDown?[15,15]:15); if(firstDown) sfxFirstDown(); else sfxCatch(); }
    else { vibrate(25); sfxIncomplete(); }

    render();
  }

  function runPlayAnim(){
    if(!S.targetId || S.simPhase!=='idle') return;
    S.selectedPlayerId = null;
    S.simPhase = 'running';
    render();
    sfxWhistle();

    var formation = getFormation(S.formationKey);
    var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
    var elig = eligibleAbs(formation, losY);
    var tokenEls = {};
    elig.forEach(function(p){
      var el = document.getElementById('pcToken-' + p.id);
      tokenEls[p.id] = { el:el, fig: el ? el.querySelector('.token-figure') : null };
    });
    var defEls = S.defenders.map(function(d){
      var el = document.getElementById('pcDef-' + d.id);
      return { def:d, el:el, fig: el ? el.querySelector('.token-figure') : null };
    });
    var ballEl = document.getElementById('pcBall');
    var qbPos = qbPosFor(formation, losY);
    var startTime = performance.now();
    var DURATION = 1500;

    function frame(now){
      var t = clamp((now-startTime)/DURATION, 0, 1);
      var routeT = Math.min(1, t/0.75);
      var ballT = clamp((t-0.75)/0.25, 0, 1);

      elig.forEach(function(p){
        var wp = S.routes[p.id];
        var pos = wp ? pointAtT(wp, routeT) : p.start;
        var pair = tokenEls[p.id];
        if(pair && pair.el){
          pair.el.style.left = pos.x + '%'; pair.el.style.top = pos.y + '%';
          if(wp && pair.fig){
            var h = routeHeadingAtT(wp, routeT);
            if(h!==null) pair.fig.style.transform = 'rotate(' + h + 'deg)';
          }
        }
      });
      defEls.forEach(function(pair){
        var pos = defenderPosAtT(pair.def, routeT, formation, losY);
        var prevPos = defenderPosAtT(pair.def, Math.max(0, routeT-0.04), formation, losY);
        if(pair.el){ pair.el.style.left = pos.x + '%'; pair.el.style.top = pos.y + '%'; }
        if(pair.fig){
          var dh = headingDeg(pos.x-prevPos.x, pos.y-prevPos.y);
          if(dh!==null) pair.fig.style.transform = 'rotate(' + dh + 'deg)';
        }
      });
      if(ballT>0){
        var targetWp = S.routes[S.targetId];
        var targetPlayer = elig.filter(function(e){ return e.id===S.targetId; })[0];
        var targetPos = targetWp ? pointAtT(targetWp, routeT) : targetPlayer.start;
        var bp = lerp(qbPos, targetPos, ballT);
        var arc = Math.sin(Math.PI*ballT)*10;
        if(ballEl){ ballEl.style.display='block'; ballEl.style.left = bp.x + '%'; ballEl.style.top = (bp.y-arc) + '%'; }
      }
      if(t<1){ requestAnimationFrame(frame); }
      else { finishPlay(formation, losY); }
    }
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------
  // Actions
  // ---------------------------------------------------------------------
  window.App = {
    goMenu:function(){ S.screen='menu'; render(); },
    goFormation:function(){ S.screen='formation'; render(); },
    goPlaybook:function(){ S.screen='playbook'; render(); },
    setDifficulty:function(key){
      S.difficulty = key;
      savePrefsLS({ difficulty:S.difficulty, muted:S.muted });
      sfxSelect();
      render();
    },
    togglePractice:function(){
      S.practiceMode = !S.practiceMode;
      sfxSelect();
      render();
    },
    toggleMute:function(){
      S.muted = !S.muted;
      savePrefsLS({ difficulty:S.difficulty, muted:S.muted });
      render();
    },
    pickFormation:function(key){
      var f = getFormation(key);
      if(!isUnlocked(f, S.career)) return;
      if(!S.practiceMode && !S.drive.active) newDrive();
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      S.formationKey=key; S.routes={}; S.targetId=null; S.selectedPlayerId=null;
      var cov = generateDefense(f, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      S.simPhase='idle'; S.result=null;
      S.screen='draw';
      vibrate(8);
      render();
      if(!localStorage.getItem(TUT_KEY)){
        S.tutorial = { active:true, step:0 };
        render();
      }
    },
    applyTemplate:function(templateKey){
      if(!S.selectedPlayerId) return;
      var elig = currentEligible();
      var p = elig.filter(function(e){ return e.id===S.selectedPlayerId; })[0];
      var tpl = ROUTE_TEMPLATES.filter(function(t){ return t.key===templateKey; })[0];
      if(!p || !tpl) return;
      var formation = getFormation(S.formationKey);
      S.routes[p.id] = tpl.build(p.start, p.start.y + 20);
      if(!S.targetId) S.targetId = p.id;
      S.selectedPlayerId = null;
      vibrate(10);
      render();
    },
    clearRoute:function(id){ delete S.routes[id]; if(S.targetId===id) S.targetId=null; render(); },
    clearAllRoutes:function(){ S.routes={}; S.targetId=null; S.selectedPlayerId=null; render(); },
    setTarget:function(id){ S.targetId=id; render(); },
    shuffleDefense:function(){
      if(S.simPhase!=='idle') return;
      var formation = getFormation(S.formationKey);
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      var cov = generateDefense(formation, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      vibrate(6);
      render();
    },
    runPlay:function(){ runPlayAnim(); },
    runAgain:function(){
      S.simPhase='idle'; S.result=null;
      var formation = getFormation(S.formationKey);
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      var cov = generateDefense(formation, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      render();
    },
    newPlay:function(){
      S.routes={}; S.targetId=null; S.selectedPlayerId=null;
      S.simPhase='idle'; S.result=null;
      var formation = getFormation(S.formationKey);
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      var cov = generateDefense(formation, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      render();
    },
    nextPlay:function(){
      S.showSaveInput=false;
      S.screen='formation';
      S.routes={}; S.targetId=null; S.selectedPlayerId=null;
      S.simPhase='idle'; S.result=null;
      render();
    },
    startNewDrive:function(){
      newDrive();
      S.showSaveInput=false;
      S.screen='formation';
      S.routes={}; S.targetId=null; S.selectedPlayerId=null;
      S.simPhase='idle'; S.result=null;
      render();
    },
    openSave:function(){
      S.showSaveInput=true; S.saveNameText='';
      render();
      setTimeout(function(){ var el=document.getElementById('pcSaveName'); if(el) el.focus(); }, 0);
    },
    cancelSave:function(){ S.showSaveInput=false; render(); },
    setSaveName:function(v){ S.saveNameText=v; },
    confirmSave:function(){
      var formation = getFormation(S.formationKey);
      var name = (S.saveNameText||'').trim() || (formation.name + ' Special');
      var play = { id:uid(), name:name, formationKey:S.formationKey, routes:S.routes, targetId:S.targetId, createdAt:Date.now() };
      S.playbook = [play].concat(S.playbook).slice(0,30);
      savePlaybookLS(S.playbook);
      S.showSaveInput=false;
      showToast('Saved "' + name + '" to your playbook!');
    },
    loadPlay:function(id){
      var play = S.playbook.filter(function(p){ return p.id===id; })[0];
      if(!play) return;
      if(!S.practiceMode && !S.drive.active) newDrive();
      var f = getFormation(play.formationKey);
      var losY = S.practiceMode ? losYFor(25) : losYFor(S.drive.fieldPos);
      S.formationKey = play.formationKey;
      S.routes = JSON.parse(JSON.stringify(play.routes));
      S.targetId = play.targetId;
      var cov = generateDefense(f, losY);
      S.coverage = cov; S.defenders = cov.defenders;
      S.simPhase='idle'; S.result=null;
      S.screen='draw';
      render();
    },
    deletePlay:function(id){
      S.playbook = S.playbook.filter(function(p){ return p.id!==id; });
      savePlaybookLS(S.playbook);
      render();
    },
    nextTutStep:function(){ S.tutorial.step = Math.min(TUT_STEPS.length-1, S.tutorial.step+1); render(); },
    skipTutorial:function(){ S.tutorial.active=false; try{ localStorage.setItem(TUT_KEY,'1'); }catch(e){} render(); },
    closeTutorial:function(){ S.tutorial.active=false; try{ localStorage.setItem(TUT_KEY,'1'); }catch(e){} render(); }
  };

  render();
})();
</script>
